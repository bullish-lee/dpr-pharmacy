# 소스에서 Windows 실행 파일을 빌드한다 (검증 가능한 빌드 — 코드 서명 정책 참고).
# SignPath 승인 뒤에는 이 워크플로의 산출물(DPR.exe)만 서명 요청을 보낸다.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    # 공개 저장소에서만 돈다 (비공개 개발 저장소에서는 건너뜀)
    if: github.repository == 'bullish-lee/dpr-pharmacy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 버전 정보 확인 (VERSION = wails.json productVersion)
        run: |
          v=$(cat VERSION)
          w=$(grep -oP '"productVersion":\s*"\K[^"]+' wails.json)
          echo "VERSION=$v wails.json=$w"
          test "$v" = "$w"

      - name: 도구 설치 (mingw-w64, Wails CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Go 테스트
        run: go test ./internal/... -timeout 300s

      - name: Windows exe 빌드
        run: make windows

      - uses: actions/upload-artifact@v4
        with:
          name: DPR-windows
          path: build/bin/DPR.exe
          if-no-files-found: error

  # 실제 Windows 에서 글자 인식(사입정보 사진 판독)이 되는지 확인한다 — 가상 사입현황 표 그림, PATH 를 비운 채로
  # (2026-11-25 약국 PC: PATH 에 PowerShell 이 없어 실패했던 일을 다시 겪지 않게)
  windows-ocr:
    if: github.repository == 'bullish-lee/dpr-pharmacy'
    needs: windows-exe # 실제로 배포하는 DPR.exe 로도 확인한다 (아래 '일꾼' 단계)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 한국어 글자 인식 설치 시도 (안 되면 영어로만 확인)
        id: ko
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 20 # Windows Update 에서 받느라 오래 걸리거나 멈출 수 있다
        run: |
          $name = 'Language.OCR~~~ko-KR~0.0.1.0'
          if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') { Add-WindowsCapability -Online -Name $name | Out-Null }
          $ok = (Get-WindowsCapability -Online -Name $name).State -eq 'Installed'
          Write-Output "한국어 글자 인식: $ok"
          "ko=$ok" >> $env:GITHUB_OUTPUT

      # 휴대폰 외부 중계(relay.go)가 받는 cloudflared 의 전자서명 확인을 실제 파일로 시험한다 (받지 못하면 그 부분만 건너뜀)
      - name: cloudflared 받기 (서명 확인 시험용, 실행하지 않음)
        id: cfd
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'cloudflared.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $p
          "path=$p" >> $env:GITHUB_OUTPUT

      - name: 글자 인식·서명 확인 테스트
        env:
          CGO_ENABLED: '0'
          DPR_TEST_CLOUDFLARED: ${{ steps.cfd.outputs.path }}
          DPR_OCR_REQUIRE: '1'
          DPR_PADDLE_REQUIRE: '1'
          DPR_OCR_REQUIRE_KO: ${{ steps.ko.outputs.ko == 'True' && '1' || '0' }}
        run: go test ./internal/platform/ ./internal/service/ -run "PowerShell|OCR|ReadLotPhotoRealOCR|VerifySigner" -v -count=1 -timeout 600s

      # 보조 글자 인식(PaddleOCR, 프로그램에 든 모델 + onnxruntime.dll): 실제 Windows 에서 열리는지 확인하고,
      # 두 엔진(Windows 기본 · PaddleOCR)의 칸별 정확도와 걸린 시간을 기록한다 — 가상 표 그림 4장 (정확도는 기록만)
      - name: 글자 인식 엔진 비교 (Windows 기본 · PaddleOCR)
        env:
          CGO_ENABLED: '0'
          DPR_PADDLE_REQUIRE: '1'
        run: go test ./internal/platform/ -run "PaddleOCRBenchmark" -v -count=1 -timeout 600s

      # onnxruntime 후보(프로그램에 든 것 · Windows 에 들어 있는 System32 것)가 각각 되는지 기록만 한다
      - name: onnxruntime 후보 확인 (기록만)
        continue-on-error: true
        env:
          CGO_ENABLED: '0'
        run: go test ./internal/platform/ -run "PaddleRuntimes" -v -count=1 -timeout 300s

      # 실제 배포하는 DPR.exe(창 프로그램)가 자기 자신을 보조 글자 인식 일꾼으로 실행해 결과를 돌려주는지 (PATH 를 비운 채로)
      - uses: actions/download-artifact@v4
        with:
          name: DPR-windows
          path: dprexe

      - name: 실제 DPR.exe 로 보조 글자 인식 일꾼 실행
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path dprexe/DPR.exe).Path
          $img = (Resolve-Path internal/platform/ocr_sample.png).Path
          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe
          $psi.Arguments = 'paddle-ocr-worker'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
          $psi.StandardErrorEncoding = [System.Text.Encoding]::UTF8
          $psi.EnvironmentVariables['PATH'] = ''
          $psi.EnvironmentVariables['DPR_OCR_PATHS'] = (ConvertTo-Json -InputObject @($img) -Compress)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = [System.Diagnostics.Process]::Start($psi)
          $errTask = $p.StandardError.ReadToEndAsync()
          $out = $p.StandardOutput.ReadToEnd()
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw '일꾼이 2분 안에 끝나지 않음' }
          Write-Output "exit=$($p.ExitCode) ms=$($sw.ElapsedMilliseconds) bytes=$($out.Length)"
          Write-Output $out.Substring(0, [Math]::Min(1500, $out.Length))
          Write-Output $errTask.Result
          foreach ($w in 'LOT-1001', 'LOT-1002', 'LOT-1003', '가람도매') {
            if ($out -notmatch [regex]::Escape($w)) { throw "일꾼 결과에 $w 없음" }
          }
